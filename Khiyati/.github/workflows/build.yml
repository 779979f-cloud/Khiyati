name: Build Khiyati APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout source
uses: actions/checkout@v4

  - name: Set up JDK
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Show project files
    run: |
      echo "Repository root:"
      pwd
      ls -la
      echo "Gradle files:"
      find . -maxdepth 4 -type f \( -name "settings.gradle.kts" -o -name "build.gradle.kts" -o -name "gradlew" \) -print

  - name: Build debug APK
    run: |
      PROJECT_DIR="."
      if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
        PROJECT_DIR=$(find . -mindepth 2 -maxdepth 4 -type f -name "settings.gradle.kts" -print -quit | xargs -r dirname)
      fi
      if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
        echo "ERROR: settings.gradle.kts not found"
        exit 1
      fi
      cd "$PROJECT_DIR"
      gradle assembleDebug

  - name: Upload APK artifact
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Khiyati-debug-apk
      path: "**/app/build/outputs/apk/debug/app-debug.apk"
      if-no-files-found: error
