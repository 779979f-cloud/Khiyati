name: Build Khiyati APK

on:
workflow_dispatch:
push:
branches: ["main"]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Check project files
    run: |
      echo "Files in repository:"
      ls -la
      echo "Searching for Gradle project:"
      find . -maxdepth 4 \( -name "settings.gradle.kts" -o -name "build.gradle.kts" -o -name "gradlew" \) -print

  - name: Set up JDK
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Build debug APK
    run: |
      if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
        gradle assembleDebug
      else
        echo "Gradle project files are not in the repository root."
        echo "Check the file locations printed above."
        exit 1
      fi

  - name: Upload APK artifact
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Khiyati-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
